[package]
name = "zolana-keypair-turnkey"
version = "0.1.0"
description = "Turnkey-backed shielded keypairs: the signing key stays in a Turnkey sub-organization and never reaches this process."
edition = "2021"
license = "Apache-2.0"

[dependencies]
async-trait = "=0.1.89"
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "hash2curve", "std"] }
solana-address = { version = "=2.6.1", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
thiserror = "=2.0.18"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread"] }
zeroize = "=1.9.0"
zolana-keypair = { git = "https://github.com/helius-labs/zolana.git", rev = "17e97dd72fd0831a5a743d0f86a9185ad7109849" }

turnkey_api_key_stamper = { version = "=0.14.0", optional = true }
turnkey_client = { version = "=0.14.0", optional = true }

[features]
default = ["api"]
# The `turnkey_client`-backed transport. Without it the crate still builds the
# backends and their `TurnkeyActivities` seam, so a caller can supply its own
# transport and tests need no HTTP stack.
api = ["turnkey_api_key_stamper", "turnkey_client"]

[dev-dependencies]
anyhow = "=1.0.103"
bincode1 = { package = "bincode", version = "=1.3.3" }
bs58 = "=0.5.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
solana-pubkey = "=4.2.0"
# Keep the Zolana/Agave 4.1 transaction graph on wincode 0.5.
solana-reward-info = "=6.2.0"
solana-short-vec = "=3.2.2"
solana-signature = "=3.4.1"
solana-transaction = { version = "=4.1.5", features = ["serde"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread"] }
# Test-only: proves a backend here satisfies `WalletAuthority` through
# `LocalWalletAuthority`. Library users get the backends without this.
zolana-client = { git = "https://github.com/helius-labs/zolana.git", rev = "17e97dd72fd0831a5a743d0f86a9185ad7109849", features = ["client"] }
zolana-transaction = { git = "https://github.com/helius-labs/zolana.git", rev = "17e97dd72fd0831a5a743d0f86a9185ad7109849" }
zolana-wallet = { git = "https://github.com/helius-labs/zolana.git", rev = "17e97dd72fd0831a5a743d0f86a9185ad7109849" }

[[test]]
name = "turnkey_backends"
path = "tests/turnkey_backends.rs"

[[test]]
name = "wallet_authority"
path = "tests/wallet_authority.rs"

# Ignored by default; needs a dedicated Turnkey test organization. See the
# module docs in tests/live.rs.
[[test]]
name = "live"
path = "tests/live.rs"

[workspace]
members = ["."]
resolver = "2"
