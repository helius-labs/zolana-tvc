[workspace]
members = ["."]
resolver = "2"

[package]
name = "zolana-tvc-boot-proof"
version = "0.1.0"
description = "Fetches a TVC replica's public Boot Proof from Turnkey for a relying party that cannot query it itself"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.53", features = ["derive"] }
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
turnkey_client = "=0.14.0"
