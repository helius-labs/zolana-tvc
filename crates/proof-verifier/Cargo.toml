[workspace]
members = ["."]
resolver = "2"

[package]
name = "zolana-tvc-proof-verifier"
version = "0.1.0"
description = "Host-side Turnkey App Proof and AWS Nitro Boot Proof verifier for development TVC releases"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.100"
bs58 = "=0.5.1"
clap = { version = "=4.5.53", features = ["derive"] }
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
solana-pubkey = "=4.2.0"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "time"] }
turnkey_client = "=0.14.0"
turnkey_proofs = "=0.14.0"
zolana-interface = { git = "https://github.com/helius-labs/zolana.git", rev = "6bf19b55fb4705b3893e91d0cd9215691d4ead65", default-features = false }
zolana-user-registry-interface = { git = "https://github.com/helius-labs/zolana.git", rev = "6bf19b55fb4705b3893e91d0cd9215691d4ead65", features = ["solana"] }
