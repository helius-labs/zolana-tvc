[package]
name = "zolana-tvc-keyholder-wallet"
version = "0.1.0"
description = "Development attested keyholder service with key oracles and an explicit external-prover spend path"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false
autobins = false

[features]
default = []
# Compile-time-only local harness. The enclave tvc_app binary and Dockerfile
# never enable this feature or link the mock custody implementation.
local-dev = [
    "dep:ed25519-dalek",
]

[dependencies]
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio"] }
async-trait = "=0.1.89"
base64 = "=0.22.1"
borsh = { version = "=1.7.0", features = ["derive"] }
bincode1 = { package = "bincode", version = "=1.3.3" }
clap = { version = "=4.5.53", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"], optional = true }
hex = "=0.4.3"
qos_core = { version = "=0.12.1", default-features = false }
qos_p256 = { version = "=0.12.1", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde_json = "=1.0.150"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
solana-account = "=4.3.1"
solana-address = "=2.6.1"
solana-compute-budget-interface = "=3.0.0"
solana-hash = "=4.5.0"
solana-instruction = "=3.4.0"
solana-message = "=4.4.0"
solana-pubkey = "=4.2.0"
solana-reward-info = "=6.2.0"
solana-signature = "=3.4.1"
solana-transaction = { version = "=4.1.5", features = ["serde", "verify", "wincode"] }
tokio = { version = "=1.48.0", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
turnkey_api_key_stamper = "=0.14.0"
turnkey_client = "=0.14.0"
zeroize = "=1.9.0"
zolana-client = { git = "https://github.com/helius-labs/zolana.git", rev = "f7b26c5e952dcbe3a728eb98adc63749c61e5044", default-features = false, features = ["indexer-api"] }
zolana-interface = { git = "https://github.com/helius-labs/zolana.git", rev = "f7b26c5e952dcbe3a728eb98adc63749c61e5044" }
zolana-keypair = { git = "https://github.com/helius-labs/zolana.git", rev = "f7b26c5e952dcbe3a728eb98adc63749c61e5044" }
zolana-keypair-turnkey = { path = "../../crates/keypair-turnkey", default-features = false, features = ["api"] }
zolana-tvc-protocol = { path = "../../crates/protocol" }
zolana-transaction = { git = "https://github.com/helius-labs/zolana.git", rev = "f7b26c5e952dcbe3a728eb98adc63749c61e5044" }
zolana-wallet = { git = "https://github.com/helius-labs/zolana.git", rev = "f7b26c5e952dcbe3a728eb98adc63749c61e5044" }

[dev-dependencies]
http-body-util = "=0.1.3"
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name = "zolana-tvc-keyholder-wallet"
path = "src/main.rs"

[[bin]]
name = "zolana-tvc-keyholder-wallet-local"
path = "src/bin/local.rs"
required-features = ["local-dev"]

[workspace]
members = ["."]
resolver = "2"
