name: headless local-TVC E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: headless-local-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AGAVE_VERSION: v4.0.2
      SBF_TOOLS_VERSION: v1.54
    defaults:
      run:
        working-directory: zolana-tvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zolana-tvc
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helius-labs/zolana
          ref: 6bf19b55fb4705b3893e91d0cd9215691d4ead65
          path: zolana
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: zolana/prover/server/go.mod
          cache-dependency-path: zolana/prover/server/go.sum
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
        working-directory: zolana
      - name: Install Anza CLI
        uses: ./zolana/.github/actions/install-anza
        with:
          version: ${{ env.AGAVE_VERSION }}
      - name: Install SBF platform tools
        uses: ./zolana/.github/actions/install-sbf-tools
        with:
          version: ${{ env.SBF_TOOLS_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            zolana-tvc
            zolana
      - name: Cache proving keys
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: zolana/prover/server/proving-keys
          key: proving-keys-${{ hashFiles('zolana/prover/server/prover/provingkeys/proving-keys.lock', 'zolana/custom-rings/custom-ring-keys.CHECKSUM') }}
      - name: Install and verify TypeScript
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
          pnpm ci:ts
      - name: Run SOL, SPL, custom-ring bridge, and merge lifecycle
        run: just headless-e2e
