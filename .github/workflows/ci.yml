name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zolana-tvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: zolana-tvc
          persist-credentials: false
      # examples/private-swap intentionally reuses the canonical swap program,
      # SDK, and prover. Preserve its sibling layout and pin the exact published
      # Zolana revision used by this integration.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helius-labs/zolana
          ref: 107570c53023c4ed1f9a8cc32d2e1e6c40f6b36c
          path: zolana
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: zolana-tvc
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just ci
