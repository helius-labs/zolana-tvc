# Publishes the privacy-wallet enclave image to the `imageRepository` of
# apps/privacy-wallet/deploy/release.json (ghcr.io/helius-labs/zolana-tvc-privacy-wallet),
# tagged with the release id. Turnkey pulls it anonymously, so the package
# must be public.
#
# The release continues on an operator's machine with the reference from the
# run summary, which `build` pulls to read the pivot digest itself:
#   node scripts/release.mjs all <release-id> --image <reference>

name: publish-privacy-wallet-image

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Release id, such as private-wallet-devnet-<sha>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-privacy-wallet-image-${{ inputs.release_id }}
  cancel-in-progress: false

env:
  RELEASE_ID: ${{ inputs.release_id }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: image-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: image
        run: echo "repository=$(jq -r .imageRepository apps/privacy-wallet/deploy/release.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A single-platform manifest without attestations, as `release.mjs build` pushes.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/privacy-wallet/Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ env.RELEASE_ID }}
          cache-from: type=gha,scope=privacy-wallet
          cache-to: type=gha,mode=max,scope=privacy-wallet

      - name: Report the image
        env:
          IMAGE: ${{ steps.image.outputs.repository }}:${{ env.RELEASE_ID }}@${{ steps.build.outputs.digest }}
        run: |
          node scripts/release.mjs build "$RELEASE_ID" --image "$IMAGE"
          pivot_digest="$(jq -r .expectedPivotDigest "apps/privacy-wallet/deploy/privacy-wallet-${RELEASE_ID}.deployment.json")"
          {
            echo '### privacy-wallet enclave'
            echo '```'
            echo "image:        $IMAGE"
            echo "pivot digest: $pivot_digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
